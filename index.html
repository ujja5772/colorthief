<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>색깔을 훔쳐간 범인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* 수사 파일 컨셉: 크림 종이 + 마닐라 폴더 + 빨간 도장, 남색 잉크. 3학년이 보기 쉽게 큰 글씨 */
:root{
  --bg:#FFF7EA;--paper:#FFFFFF;--kraft:#F6E3BC;--kraft2:#EBCB8E;--ink:#2B2638;--soft:#6E6680;--line:#EADFCB;
  --blue:#2F5BD3;--stamp:#E0473C;--mustard:#FFC53D;--ok:#2B9A57;--warn:#E8590C;
  --f-d:'Jua','Noto Sans KR','Noto Sans CJK KR',sans-serif;--f-b:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--f-e:'Andika','Noto Sans KR',sans-serif;--f-t:'Nunito','Noto Sans KR','Noto Sans CJK KR',sans-serif;
  color-scheme:light
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;-webkit-font-smoothing:antialiased;background:var(--bg);background-image:linear-gradient(rgba(43,38,56,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(43,38,56,.035) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--f-b);font-size:19px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-d);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
.en{font-family:var(--f-e);font-weight:700}
.soft{color:var(--soft)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.col{display:grid;gap:14px;min-width:0}
.card{background:var(--paper);border-radius:26px;box-shadow:0 6px 0 var(--line),0 14px 30px rgba(43,38,56,.06);padding:22px}
.folder{background:var(--kraft);border-radius:8px 26px 26px 26px;box-shadow:0 6px 0 var(--kraft2);padding:22px;position:relative}
.folder::before{content:"";position:absolute;left:0;top:-22px;width:170px;height:24px;background:var(--kraft);border-radius:12px 12px 0 0}
.btn{border:0;border-radius:18px;padding:12px 22px;font-family:var(--f-d);font-size:22px;background:var(--paper);box-shadow:0 5px 0 rgba(43,38,56,.16),0 0 0 2px var(--line) inset;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,38,56,.16),0 0 0 2px var(--line) inset}
.btn.go{background:var(--blue);color:#fff;box-shadow:0 5px 0 #1D3F9E}
.btn.red{background:var(--stamp);color:#fff;box-shadow:0 5px 0 #A92F26}
.btn.yel{background:var(--mustard);box-shadow:0 5px 0 #C9951B}
.btn.big{font-size:28px;padding:16px 32px}
.btn.sm{font-size:17px;padding:6px 12px;border-radius:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 14px;font-family:var(--f-d);font-size:18px;background:var(--paper)}
.stamp{display:inline-block;font-family:var(--f-d);color:var(--stamp);border:4px solid var(--stamp);border-radius:12px;padding:2px 14px;transform:rotate(-6deg);letter-spacing:.06em}
/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(255,247,234,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top-in{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.logo b{font-family:var(--f-d);font-weight:400;font-size:28px}
.logo span{font-size:30px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{border:0;border-radius:16px;padding:8px 16px;font-family:var(--f-d);font-size:20px;background:var(--paper);box-shadow:0 4px 0 rgba(43,38,56,.12)}
.nav button.on{background:var(--ink);color:#fff}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
.cls{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:14px;padding:4px 10px;font-family:var(--f-d);box-shadow:0 4px 0 rgba(43,38,56,.12)}
.cls input{width:70px;border:0;background:var(--kraft);border-radius:8px;padding:2px 6px;font-family:var(--f-e);font-weight:700}
main{max-width:1600px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
/* suspect canvas */
.sus{display:block;height:auto;max-width:100%;touch-action:manipulation;user-select:none}
.split>.sus-wrap{position:sticky;top:80px}
.sus-wrap{background:var(--paper);border-radius:22px;box-shadow:inset 0 0 0 3px var(--line);padding:10px;display:grid;place-items:center}
.palette{display:flex;flex-wrap:wrap;gap:12px}
.pal{border:0;width:66px;height:66px;border-radius:50%;background:var(--c);box-shadow:inset 0 -7px 0 rgba(0,0,0,.1),0 0 0 3px #fff,0 0 0 5px var(--line)}
.pal.on{box-shadow:inset 0 -7px 0 rgba(0,0,0,.1),0 0 0 4px #fff,0 0 0 8px var(--ink);transform:scale(1.06)}
.dot{display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 0 0 2px #fff,0 0 0 4px var(--line);flex:none;vertical-align:middle}
.partchip{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:#FBF5EA;font-family:var(--f-d);font-size:20px}
.partchip.done{background:#E6F6EC}
.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-d);font-size:20px;flex:none}
/* steps */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps>span{font-family:var(--f-d);font-size:17px;padding:4px 12px;border-radius:999px;background:var(--paper);color:var(--soft)}
.steps>span.on{background:var(--ink);color:#fff}
.steps>span.done{background:#E6F6EC;color:var(--ok)}
.split{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
/* statement */
.stmt{display:grid;gap:2px;padding:8px 14px;border-radius:18px;background:#FBF5EA}
.stmt.ok{background:#E6F6EC}
.stmt.now{box-shadow:0 0 0 3px var(--mustard) inset}
.stmt .q{font-family:var(--f-e);font-weight:700;font-size:20px;color:var(--soft)}
.stmt .a{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-e);font-weight:700;font-size:30px}
.stmt input{font-family:var(--f-e);font-weight:700;font-size:30px;width:190px;border:0;border-bottom:4px solid var(--ink);background:#fff;border-radius:10px 10px 0 0;padding:0 8px}
.script{font-family:var(--f-e);font-weight:700;font-size:28px;line-height:1.6;background:#FBF5EA;border-radius:18px;padding:16px 20px}
.script .hl{background:var(--mustard);border-radius:8px}
.wordbank{display:flex;flex-wrap:wrap;gap:8px;background:#fff;border:3px dashed var(--kraft2);border-radius:16px;padding:10px 12px}
.wordbank span.dot{background:var(--c);padding:0;border-radius:50%;font-size:0}
.wordbank.hinton{border-color:var(--blue);background:#EEF3FF}
.wordbank span{font-family:var(--f-e);font-weight:700;font-size:24px;padding:2px 12px;border-radius:10px;background:#FBF5EA}
.wb{border:0;font-family:var(--f-e);font-weight:700;font-size:19px;padding:3px 8px;border-radius:10px;background:#FBF5EA;box-shadow:0 3px 0 var(--line)}
.wb:active{transform:translateY(2px)}
.wb.big{font-size:44px;padding:0 10px;background:#E6F6EC;box-shadow:0 4px 0 #BFE3CC;border-bottom:5px solid var(--ok)}
.regGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.rg{border:0;border-radius:12px;padding:6px 4px;background:#F1ECE3;color:var(--soft);display:grid;justify-items:center;font-family:var(--f-d)}
.rg b{font-weight:400;font-size:20px}.rg small{font-size:13px;min-height:16px}
.rg.ok{background:#E6F6EC;color:var(--ink)}.rg.warn{background:#FFE8D6;color:var(--ink);box-shadow:0 0 0 3px var(--warn) inset}
.rg:disabled{opacity:.6;cursor:default}
/* oral */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.rbtn{border:0;border-radius:16px;padding:10px;background:var(--paper);box-shadow:0 4px 0 var(--line);font-family:var(--f-d);font-size:20px;text-align:left;display:grid;gap:2px}
.rbtn small{font-family:var(--f-b);font-size:14px;color:var(--soft)}
.rbtn.done{background:#E6F6EC}
.lineup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.lu{border:0;background:var(--paper);border-radius:24px;padding:12px;box-shadow:0 6px 0 var(--line);display:grid;justify-items:center;gap:6px;transition:transform .15s}
.lu b{font-family:var(--f-d);font-size:40px;font-weight:400}
.lu:hover{transform:translateY(-4px)}
.lu.real{box-shadow:0 0 0 6px var(--ok),0 6px 0 var(--line)}
.lu.wrong{opacity:.45}
.tpanel{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;background:var(--paper);border-radius:20px;box-shadow:0 10px 30px rgba(43,38,56,.25);padding:12px 14px;width:min(380px,calc(100vw - 28px));display:grid;gap:8px}
.tpanel.mini .tbody{display:none}
.tpbtn{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.7);box-shadow:0 2px 8px rgba(43,38,56,.2);font-size:18px;opacity:.55}
.tpbtn:hover{opacity:1}.tpbtn.done{box-shadow:0 0 0 3px var(--ok),0 2px 8px rgba(43,38,56,.2)}.tpbtn.saving{box-shadow:0 0 0 3px var(--mustard)}.tpbtn.err{box-shadow:0 0 0 3px var(--stamp)}
.sbtn{border:0;border-radius:12px;padding:8px 0;background:#FBF5EA;font-family:var(--f-d);font-size:20px}
.sbtn.on{background:var(--ink);color:#fff}
.ask{font-family:var(--f-e);font-weight:700;font-size:clamp(40px,5vw,72px);line-height:1.1}
/* table */
.tw{overflow-x:auto;border-radius:18px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:17px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-family:var(--f-d);font-weight:400;color:var(--soft);background:#FBF5EA;position:sticky;top:0}
td select,td input{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff}
.okc{color:var(--ok);font-weight:700}.noc{color:var(--warn);font-weight:700}
/* misc */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;display:grid;gap:8px;justify-items:center;pointer-events:none}
.tst{background:var(--ink);color:#fff;border-radius:999px;padding:12px 26px;font-family:var(--f-d);font-size:22px;animation:tin .25s}
@keyframes tin{from{transform:translateY(14px);opacity:0}}
.cf{position:fixed;z-index:95;width:12px;height:16px;border-radius:3px;pointer-events:none;animation:cf 1.6s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rec{animation:recp 1s infinite}
@keyframes recp{50%{opacity:.6}}
#printArea{display:none}
.pxh{gap:3mm}.pxkey{display:flex;flex-wrap:wrap;gap:1.5mm 4mm;font-family:var(--f-e);font-size:12pt;border:1.5px solid #000;border-radius:2mm;padding:2mm 3mm}.pxkey b{display:inline-grid;place-items:center;width:6mm;height:6mm;border:1.2px solid #000;border-radius:1mm;font-size:10pt}.pxkey .soft{font-family:var(--f-b);font-size:9pt;color:#555}.pxtab{display:grid;grid-template-columns:repeat(16,7.2mm);grid-auto-rows:7.2mm;justify-content:center;border:1.5px solid #000;align-self:center}.pxtab i{border:.3mm solid #999;display:grid;place-items:center;font-style:normal;font-family:var(--f-e);font-size:8.5pt;color:#444}.pxq2 p{margin:1.5mm 0;font-family:var(--f-e);font-size:13pt}.pxq2 u{display:inline-block;min-width:38mm;text-decoration:none;border-bottom:1px solid #000;text-align:center;font-weight:700}
.wst2{width:100%;border-collapse:collapse;font-size:11pt;flex:1}.wst2 th{font-family:var(--f-d);font-weight:400;font-size:11pt;border-bottom:2px solid #000;padding:1mm;color:#000;background:none;position:static}.wst2 td{border-bottom:1px solid #999;padding:1mm 1.5mm;vertical-align:middle;white-space:normal}.wst2 .no{font-family:var(--f-d);font-size:15pt;text-align:center;width:11mm}.wst2 .abcd{white-space:nowrap;text-align:center}.wst2 .abcd span{margin:0 2.5mm!important}.wst2 .abcd span{display:inline-grid;place-items:center;width:8mm;height:8mm;border:1.5px solid #000;border-radius:50%;margin-right:1.5mm;font-family:var(--f-e);font-weight:700;font-size:12pt}.wst2 .clue{font-family:var(--f-e);font-size:11.5pt;line-height:1.75}.wst2 .clue i{display:inline-block;width:27mm;border-bottom:1px solid #000;height:4mm}.wst2.r10 .clue{font-size:10.5pt;line-height:1.45}.wst2.r10 td{padding:.6mm 1.5mm}.wst2.r10 .abcd span{width:7mm;height:7mm;font-size:11pt}.wst2.r10 .no{font-size:13pt}.wst2 .ox{white-space:nowrap;text-align:center;font-size:14pt;width:30mm}
.wsh{height:188mm;padding:2mm 7mm;box-sizing:border-box;display:flex;flex-direction:column;gap:3mm;font-family:var(--f-b);color:#000}.wsh+.wsh{border-left:1.5px dashed #888}.wsh header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #000;padding-bottom:2mm}.wsh header b{font-family:var(--f-d);font-weight:400;font-size:17pt}.wsh header span{font-size:10pt}.ansb{background:#000;color:#fff;border-radius:3mm;padding:0 3mm;font-size:11pt;margin-left:2mm}.wsi{margin:0;font-size:11pt}.wsb{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4mm;align-items:center;min-height:0}.wsp{border:2px solid #000;border-radius:3mm;padding:3mm;display:grid;gap:2.2mm}.wst{text-align:center;font-family:var(--f-d);font-size:18pt;letter-spacing:.1em;border:2px solid #000;border-radius:2mm;transform:rotate(-2deg);justify-self:center;padding:0 4mm}.wsl{display:flex;gap:2mm;align-items:flex-start;font-family:var(--f-e);font-size:13pt;line-height:1.25}.wsl .q{color:#333}.wsl b{font-size:15pt}.wsl .ck{font-size:14pt}.wsimg{height:100%;display:grid;place-items:center;min-height:0}.wsimg img{max-height:150mm;max-width:100%;width:auto}.wsh footer{font-size:9.5pt;color:#333}
.wsov{position:fixed;inset:0;z-index:80;background:rgba(43,38,56,.75);overflow:auto;padding:12px;display:grid;justify-items:center;align-content:start;gap:10px}
.wsbar{background:#fff;border-radius:16px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;width:min(100%,1120px)}
.wspage{width:min(100%,1120px,calc((100vh - 150px)*297/210));aspect-ratio:297/210;background:#fff;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden;display:grid;place-items:center}
.wsa4{width:277mm;height:190mm;display:grid;grid-template-columns:1fr 1fr;transform-origin:center;zoom:var(--z,1)}
.wsnote{color:#fff;margin:0;font-size:17px}
@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff}body>*:not(#printArea){display:none!important}#printArea{display:grid!important;grid-template-columns:repeat(4,1fr);gap:6mm}#printArea.ws{grid-template-columns:1fr 1fr;gap:0}.pc{break-inside:avoid;border:1.5px solid #999;border-radius:4mm;padding:3mm;text-align:center}.pc img{height:150mm;width:auto;max-width:100%}.pch{font-family:var(--f-d);font-size:13pt;margin-bottom:2mm}}

/* ---- 수사 본부 ---- */
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.hubtag{font-size:16px;color:#fff}.hubtag.h0{background:#2F5BD3}.hubtag.h1{background:#D9822B}.hubtag.h2{background:#2B9A57}.hubtag.h3{background:#9762EB}.hubtag.h4{background:#E0473C}
.hubcard{border:0;text-align:left;display:grid;gap:6px;align-content:start;transition:transform .12s}
.hubcard:hover{transform:translateY(-3px)}
.hubcard b{font-family:var(--f-d);font-weight:400;font-size:30px}
.hubic{font-size:44px;line-height:1}
.track{position:relative;display:flex;align-items:center;gap:0;justify-content:space-between;background:#fff;border-radius:999px;padding:10px 70px 10px 60px;box-shadow:inset 0 0 0 3px var(--line);margin-bottom:14px;height:62px}
.trk-bar{flex:1;height:18px;border-radius:999px;background:#E6DFD2;overflow:hidden}.trk-bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .35s}
.fpsetup{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start}
.lbl{font-family:var(--f-d);font-weight:400;font-size:22px}
.fprank{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.fprank>div{background:#FBF5EA;border-radius:12px;padding:6px;display:grid;justify-items:center;font-family:var(--f-d)}.fprank>div.me{background:#FFF1C9;box-shadow:0 0 0 3px var(--mustard) inset}.fprank b{font-weight:400;font-size:18px}.fprank span{font-family:var(--f-e);font-weight:700;font-size:20px}.fprank small{font-size:13px;color:var(--soft);min-height:15px}
.fpcls .tr,.fprank .tr{display:none!important}
.fpbox{display:grid;gap:12px;background:rgba(255,255,255,.55);border-radius:18px;padding:14px 16px}.fpboxh{font-family:var(--f-d);font-weight:400;font-size:22px}
.fpcls{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.fpcls .sbtn{font-size:24px;padding:10px 0}
.stepv .tr{display:none!important}
.stepv{font-family:var(--f-e);font-size:26px;min-width:90px;text-align:center}
.fpcfg summary{font-family:var(--f-d);font-size:20px;cursor:pointer}
.fptop{margin:0;padding-left:26px;font-size:20px;line-height:1.6}
@media (max-width:1000px){.fpsetup{grid-template-columns:1fr}}
.trk-det{position:absolute;left:4px;font-size:42px;transition:left .35s}.trk-thief{position:absolute;right:10px;font-size:42px}
.fpfield{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 22px;padding:6px 0}
.fpfield>.foot{width:min(17%,210px)}
.fpfield>.folder{width:100%}
.foot{border:0;background:#fff;border-radius:22px;padding:14px 8px;box-shadow:0 5px 0 var(--line);transform:rotate(var(--r));transition:transform .15s}
.foot img{width:100%;height:auto;max-height:23vh;object-fit:contain;display:block;pointer-events:none;user-select:none}
.foot:active{transform:rotate(var(--r)) scale(.94)}
.foot.got{background:#E6F6EC;box-shadow:0 0 0 5px var(--ok)}
.fpfield.float .foot{animation:flt 2.2s ease-in-out var(--d) infinite alternate}
@keyframes flt{to{transform:rotate(calc(var(--r)*-1)) translateY(-18px)}}

.c4lay{display:grid;grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr);gap:18px;align-items:start}
.c4team{border:0;border-radius:24px;padding:18px 10px;display:grid;justify-items:center;gap:6px;background:#fff;box-shadow:0 6px 0 var(--line);opacity:.55;transition:.2s}
.c4team.on{opacity:1;transform:scale(1.03)}
.c4team.t1.on{box-shadow:0 0 0 6px #4B3F72,0 6px 0 var(--line)}.c4team.t2.on{box-shadow:0 0 0 6px #E0A100,0 6px 0 var(--line)}
.c4tic{font-size:64px;line-height:1}.c4team b{font-family:var(--f-d);font-weight:400;font-size:30px}

  if(fn==='mt_hide'){(d.scores[args.p_id]=d.scores[args.p_id]||{}).hidden=true;DB.save(d);return null}

const SUS={};
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
async function loadSus(k){if(SUS[k])return SUS[k];const m=SUSPECT_DATA[k];const [li,pi,bi]=await Promise.all([loadImg(m.line),loadImg(m.part),loadImg(m.base)]);
  const c=document.createElement('canvas');c.width=m.w;c.height=m.h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(pi,0,0);const d=x.getImageData(0,0,m.w,m.h).data;
  x.clearRect(0,0,m.w,m.h);x.drawImage(bi,0,0);const base=x.getImageData(0,0,m.w,m.h).data.slice();const lab=new Uint8Array(m.w*m.h);const idx=[[],[],[],[],[],[]];for(let i=0;i<lab.length;i++){const v=Math.round(d[i*4]/40);lab[i]=v;if(v>0&&v<6)idx[v].push(i)}
  const out=new Uint8Array(m.w*m.h);{const la=document.createElement('canvas');la.width=m.w;la.height=m.h;const lx=la.getContext('2d');lx.drawImage(li,0,0);const ld=lx.getImageData(0,0,m.w,m.h).data;
    const open=i=>lab[i]===0&&base[i*4]>250&&base[i*4+1]>250&&base[i*4+2]>250&&ld[i*4+3]<90;const q=[];
    for(let x=0;x<m.w;x++){q.push(x,(m.h-1)*m.w+x)}for(let y=0;y<m.h;y++){q.push(y*m.w,y*m.w+m.w-1)}
    while(q.length){const i=q.pop();if(out[i]||!open(i))continue;out[i]=1;const x=i%m.w,y=(i/m.w)|0;if(x>0)q.push(i-1);if(x<m.w-1)q.push(i+1);if(y>0)q.push(i-m.w);if(y<m.h-1)q.push(i+m.w)}}
  SUS[k]=Object.assign({},m,{lineImg:li,base,out,lab,idx:idx.map(a=>Uint32Array.from(a))});return SUS[k]}
const loadAll=()=>Promise.all(['a','b','c','d'].map(loadSus));
const OFF={};
function paintSus(cv,k,colors,o={}){const S=SUS[k];if(!S)return;const sc=o.scale||1;
  const key=k;if(!OFF[key]){const c=document.createElement('canvas');c.width=S.w;c.height=S.h;OFF[key]=c}const oc=OFF[key],ox=oc.getContext('2d');
  const img=ox.createImageData(S.w,S.h),d=img.data;d.set(S.base);
  for(let p=1;p<=5;p++){const c=colors&&colors[p];let rgb=c?COL[c].rgb:null;if(o.hl===p&&!o.markers)rgb=rgb?rgb.map((v,i)=>Math.round(v*.55+[255,213,61][i]*.45)):[255,224,130];if(!rgb)continue;const a=S.idx[p];for(let j=0;j<a.length;j++){const q=a[j]*4;d[q]=rgb[0];d[q+1]=rgb[1];d[q+2]=rgb[2]}}
  if(o.clear){const O=S.out;for(let i=0;i<O.length;i++)if(O[i])d[i*4+3]=0}ox.putImageData(img,0,0);cv.width=Math.round(S.w*sc);cv.height=Math.round(S.h*sc);const x=cv.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(oc,0,0,cv.width,cv.height);x.drawImage(S.lineImg,0,0,cv.width,cv.height);
  if(o.markers)for(let p=1;p<=5;p++){const [mx,my]=S.cent[p];const r=Math.max(13,22*sc*(o.mScale||1))*(o.hl===p?1.35:1);if(o.hl===p){x.beginPath();x.arc(mx*sc,my*sc,r+9*Math.max(sc,.6),0,Math.PI*2);x.fillStyle='rgba(255,197,61,.45)';x.fill()}x.beginPath();x.arc(mx*sc,my*sc,r,0,Math.PI*2);x.fillStyle=o.hl===p?'#FFC53D':'#2B2638';x.fill();x.lineWidth=3;x.strokeStyle='#fff';x.stroke();x.fillStyle=o.hl===p?'#2B2638':'#fff';x.font=`${Math.round(r*1.15)}px Jua, sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(String(p),mx*sc,my*sc+1)}}
function partAt(k,x,y){const S=SUS[k];x=Math.round(x);y=Math.round(y);for(let r=0;r<=10;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=S.w||yy>=S.h)continue;const v=S.lab[yy*S.w+xx];if(v>0&&v<6)return v}return 0}

      const fr=new FileReader();fr.onload=()=>{CLIPS[i]=fr.result;done()};fr.readAsDataURL(blob)};

function pinGate(next){

  const ok=async()=>{const v=$('#pin').value;if(!v)return;const b=$('#ok');b.disabled=true;try{const r=await API.rpc('mt_check_pin',{p_pin:v});if(r===true){PIN=v;SS.set('mt_pin',v);next()}else{toast('비밀번호가 달라요');b.disabled=false}}catch(e){toast('서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요');b.disabled=false}};
  $('#ok').onclick=ok;$('#pin').onkeydown=e=>{if(e.key==='Enter')ok()};$('#pin').focus();
}
async function loadRows(cls){const rows=await API.rpc('mt_teacher_list',{p_pin:PIN,p_class:cls});return rows||[]}

const effW=r=>r.written_score??r.written_auto??0;
const wLabel=v=>v>=75?'매우잘함':v>=65?'잘함':'보통';
const total=r=>effW(r)+(r.oral_score??0);
async function saveScores(r){await API.rpc('mt_set_scores',{p_pin:PIN,p_id:r.id,p_written:r.written_score??null,p_record:r.record_score??null,p_oral:r.oral_score??null,p_lineup:r.lineup??null,p_memo:r.memo??null})}

function makeDecoys(colors,parts=[1,2,3,4,5]){const out=[],seen=new Set([JSON.stringify(colors)]);let g=0;while(out.length<3&&g++<300){const d=Object.assign({},colors);const n=Math.random()<.55?1:2;shuffle(parts).slice(0,Math.min(n,parts.length)).forEach(p=>{d[p]=pick(W9.filter(c=>c!==colors[p]))});const s=JSON.stringify(d);if(!seen.has(s)){seen.add(s);out.push(d)}}return out}
function startCase(r){OR.cur=r;OR.step=0;OR.phase='ask';OR.parts=OCFG.n>=5?[1,2,3,4,5]:shuffle([1,2,3,4,5]).slice(0,OCFG.n).sort((x,y)=>x-y);const opts=shuffle([{real:true,colors:r.colors},...makeDecoys(r.colors,OR.parts).map(c=>({real:false,colors:c}))]);OR.lineup=opts;OR.pickd=null;drawCase()}

     <p style="font-family:var(--f-d);font-size:28px;margin:0">🙋 목격자: <span class="en">"It's ___."</span></p><p class="soft" style="margin:0;font-size:20px">👂 잘 듣고 기억해요! 마지막에 진짜 범인을 골라야 해요.</p>
     <button class="btn go big" id="next">${OR.step<OR.parts.length-1?'다음 ▶':OCFG.lineup?'용의자 라인업 보기 👀':'범인 공개 🔍'}</button></div></div>`}
  else if(OR.phase==='answer'){body=`<div class="split" style="grid-template-columns:auto minmax(0,1fr)"><div class="sus-wrap"><canvas class="sus" id="ans" style="height:min(72vh,700px);width:auto"></canvas></div><div class="col" style="align-content:center;justify-items:center;text-align:center;gap:18px"><span class="stamp" style="font-size:34px">범인 공개</span><div class="ask" style="font-size:clamp(34px,4vw,56px)">"That's right!"</div><p style="font-family:var(--f-d);font-size:24px;margin:0">목격자가 말한 색깔이 맞았나요? 다 함께 확인해요.</p><div class="row" style="justify-content:center"><button class="btn" id="back">명단으로</button><button class="btn yel big" id="nextw">🎲 다음 목격자</button></div></div></div>`}
  else{body=`<div class="col" style="text-align:center"><h2 style="font-size:40px">${OR.phase==='lineup'?'진짜 범인은 누구일까요? 🤔':OR.lineup[OR.pickd]?.real?'범인 체포! 🎉':'앗! 범인이 아니에요 😮'}</h2>
     ${OR.phase==='reveal'?`<p style="margin:0;font-size:24px;font-family:var(--f-d)">${OR.lineup[OR.pickd].real?'<span class="en">"That\'s right!"</span> 목격자의 설명이 정확했어요!':'초록색 테두리가 진짜 범인이에요. 어디가 달랐을까요?'}</p>`:'<p style="margin:0;font-size:22px;font-family:var(--f-d)" class="soft">반 친구들이 고른 용의자를 눌러요.</p>'}
     <div class="lineup">${OR.lineup.map((o,i)=>`<button class="lu ${OR.phase==='reveal'?(o.real?'real':(i===OR.pickd?'wrong':'')):''}" data-lu="${i}"><b>${'ABCD'[i]}</b><canvas class="sus" data-lc="${i}" style="height:min(50vh,500px);width:auto"></canvas></button>`).join('')}</div>

/* ---------- 내가 칠한 범인 다시 보기 (학생, 글자 없이 그림만) ---------- */
async function showMine(m){if(!m)return;await loadAll();const S=SUS[m.sus];
  const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;z-index:60;background:rgba(43,38,56,.75);display:grid;place-items:center;padding:16px';
  ov.innerHTML=`<div class="folder row" style="align-items:center;max-width:820px"><canvas class="sus" id="mv" style="height:78vh;width:auto;background:#fff;border-radius:16px"></canvas><div class="col"><h2 style="font-size:30px">${esc(m.no)}번<br>목격자의 범인</h2><div class="col" style="gap:8px">${[1,2,3,4,5].map(p=>`<div class="partchip"><span class="num">${p}</span>${S.names[p-1]} <span class="en" style="color:var(--blue)">${S.en[p-1]}</span></div>`).join('')}</div><p class="soft" style="margin:0">구술 평가 때 이 그림을 보면서 "It's ___."로 말해요.</p><button class="btn go" id="mvx">닫기</button></div></div>`;
  document.body.appendChild(ov);paintSus($('#mv'),m.sus,m.colors,{markers:true});ov.onclick=e=>{if(e.target===ov||e.target.id==='mvx')ov.remove()}}
/* ---------- 목격자 그림 카드 인쇄 (글자 없이 그림만, 한 장에 4명) ---------- */
async function printCards(){const rows=latestOnly(TV.rows);if(!rows.length)return toast('인쇄할 수사 파일이 없어요');await loadAll();
  let pa=$('#printArea');if(!pa){pa=document.createElement('div');pa.id='printArea';document.body.appendChild(pa)}pa.className='';
  pa.innerHTML=rows.map(r=>`<div class="pc"><div class="pch">${esc(r.class_code)}반 ${esc(r.student_no)}번 · ${SUSNAME[r.suspect]}</div><img src="${susImg(r.suspect,r.colors,.8)}" alt=""></div>`).join('');
  setTimeout(()=>window.print(),300)}

const gI=(f,ms)=>{const x=setInterval(f,ms);G.t.push(x);return x};
const PARTS=[];['a','b','c','d'].forEach(k=>[1,2,3,4,5].forEach(p=>PARTS.push({k,p})));
const enOf=(k,p)=>SUSPECT_DATA[k].en[p-1];
const koOf=(k,p)=>SUSPECT_DATA[k].names[p-1];
const CAP=s=>s.charAt(0).toUpperCase()+s.slice(1);
const best=(key,v)=>{const k='mt_best_'+key+'_'+CLS;const o=LS.get(k,null);if(v!=null&&(o==null||v<o)){LS.set(k,v);return {old:o,isNew:true}}return {old:o,isNew:false}};
const FOOT_SVG=c=>`<svg viewBox="0 0 64 84" aria-hidden="true"><g fill="${hex(c)}" stroke="#2B2638" stroke-width="3"><ellipse cx="34" cy="56" rx="19" ry="24"/><circle cx="13" cy="24" r="7"/><circle cx="25" cy="14" r="7.5"/><circle cx="39" cy="12" r="7.5"/><circle cx="52" cy="19" r="7"/></g></svg>`;

let FP=Object.assign({lv:1,n:10,cls:1,no:'',nc:10},LS.get('mt_fp_cfg',{}));if(FP.n<10)FP.n=10;
const fpKey=(c,lv,n)=>`${c}|${lv}|${n}`;
const fpRecs=()=>LS.get('mt_fp_rec',{});
function fpAdd(c,lv,n,t,no){const R=fpRecs();const k=fpKey(c,lv,n);const L=R[k]||[];const old=L.length?L[0].t:null;const ent={t,no,at:Date.now()};L.push(ent);L.sort((a,b)=>a.t-b.t);R[k]=L.slice(0,30);LS.set('mt_fp_rec',R);
  return {old,isNew:old==null||t<old,rank:L.indexOf(ent)+1,total:L.length}}
function fpSetup(){
  LS.set('mt_fp_cfg',FP);const R=fpRecs();
  if(FP.cls>FP.nc)FP.cls=1;const board=Array.from({length:FP.nc},(_,i)=>{const L=R[fpKey(i+1,FP.lv,FP.n)]||[];return {c:i+1,b:L[0]||null,cnt:L.length}});
  const mine=(R[fpKey(FP.cls,FP.lv,FP.n)]||[]).slice(0,5);
  app.innerHTML=shell(gHead('🐾 도둑의 발자국 추격')+`<div class="fpsetup"><div class="folder col" style="gap:16px">

    <div class="fprank" style="grid-template-columns:repeat(${Math.min(5,FP.nc)},1fr)">${board.map(x=>`<div class="${x.c===FP.cls?'me':''}"><b>${x.c}반</b><span>${x.b?x.b.t.toFixed(1)+'초':'-'}</span><small>${x.b&&x.b.no?x.b.no+'번':''}</small></div>`).join('')}</div>

/* ---------- 2. 수사 본부 4목 (말하기) ---------- */
const C4R=6,C4C=7;let C4=null;let C4O=Object.assign({words:false},LS.get('mt_c4opt',{}));
const C4T=[null,{n:'범인팀',ic:'🦹'},{n:'경찰팀',ic:'🚓'}];
function c4Setup(keep){const sc=keep&&C4?C4.score:LS.get('mt_c4score_'+CLS,[0,0]);C4={grid:Array.from({length:C4R},()=>Array(C4C).fill(0)),cols:shuffle(W9).slice(0,C4C),turn:keep&&C4?(C4.win===1?2:1):1,win:null,line:null,hist:[],score:sc};c4Draw()}
function c4Draw(){
  const full=c=>!!C4.grid[0][c];
  const team=t=>`<button class="c4team t${t} ${(!C4.win&&C4.turn===t)||C4.win===t?'on':''}" data-team="${t}"><span class="c4tic">${C4T[t].ic}</span><b>${C4T[t].n}</b><span class="c4win">승리 ${C4.score[t-1]}회</span><span class="c4now">${C4.win===t?'🎉 승리!':!C4.win&&C4.turn===t?'지금 우리 차례!':'&nbsp;'}</span></button>`;
  app.innerHTML=shell(gHead('🟡 수사 본부 4목',`<button class="sbtn ${C4O.words?'on':''}" id="c4W" style="padding:6px 12px">💡 단어 보이기</button><button class="btn sm" id="c4Undo" ${C4.hist.length?'':'disabled'}>↩ 실행 취소</button><button class="btn sm" id="c4New">🔄 다시하기</button><button class="btn sm" id="c4Reset">전체 초기화</button>`)+
   `<div class="c4lay">${team(1)}<div class="c4mid">
     <div class="c4ask">${C4.win==='draw'?`<b>칸이 다 찼어요! 무승부</b> <button class="btn go" id="c4Next">다음 판 시작 ▶</button>`:C4.win?`<b>${C4T[C4.win].ic} ${C4T[C4.win].n} 승리! 4개를 먼저 연결했어요</b> <button class="btn go" id="c4Next">다음 판 시작 ▶</button>`:`<span>🙋 <b>${C4T[C4.turn===1?2:1].n}</b>: <span class="en">What color is it?</span></span><span>🗣️ <b>${C4T[C4.turn].n}</b>: <span class="en">It's ___!</span></span>`}</div>
     <div class="c4board">${Array.from({length:C4C},(_,c)=>`<div class="c4col">${Array.from({length:C4R},(_,r)=>`<span class="c4cell ${C4.grid[r][c]?'p'+C4.grid[r][c]:''} ${C4.line&&C4.line.some(([y,x])=>y===r&&x===c)?'w':''}"></span>`).join('')}</div>`).join('')}</div>
     <div class="c4cards">${C4.cols.map((c,i)=>`<button class="c4card" data-i="${i}" ${C4.win||full(i)?'disabled':''} aria-label="${c}"><span class="blob" style="--c:${hex(c)}"></span><small class="en">${C4O.words?c:'&nbsp;'}</small></button>`).join('')}</div>
     <p class="soft" style="margin:0;text-align:center;font-size:17px">색 이름을 말한 줄의 색 카드를 누르면 칩이 떨어져요 · 말을 틀리면 상대 팀 카드를 눌러 차례를 넘겨요</p>
    </div>${team(2)}</div>`);
  gBind();
  $('#c4W').onclick=()=>{C4O.words=!C4O.words;LS.set('mt_c4opt',C4O);c4Draw()};
  $('#c4New').onclick=()=>c4Setup(true);
  $('#c4Reset').onclick=e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure='1';b.textContent='정말 초기화?';return}LS.set('mt_c4score_'+CLS,[0,0]);C4=null;c4Setup()};
  $('#c4Undo').onclick=()=>{const m=C4.hist.pop();if(!m)return;C4.grid[m.r][m.c]=0;if(C4.win&&C4.win!=='draw'){C4.score[C4.win-1]--;LS.set('mt_c4score_'+CLS,C4.score)}C4.win=null;C4.line=null;C4.turn=m.p;c4Draw()};
  const nx=$('#c4Next');if(nx)nx.onclick=()=>c4Setup(true);
  $$('[data-team]').forEach(b=>b.onclick=()=>{if(C4.win)return;C4.turn=+b.dataset.team;c4Draw()});
  $$('.c4card').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(C4.win||full(i))return;const c=C4.cols[i];const t=C4.turn;hush();speak(`It's ${c}!`);c4Drop(i,t);c4Pop(c,t)});
}
function c4Pop(c,t){const b=$('.c4board');if(!b)return;const d=document.createElement('div');d.className='c4pop t'+t;d.innerHTML=`<span class="dot" style="--c:${hex(c)}"></span><span class="en">It's ${c}!</span>`;b.appendChild(d);gT(()=>d.remove(),1500)}
function c4Drop(c,p){let r=C4R-1;while(r>=0&&C4.grid[r][c])r--;if(r<0)return;C4.grid[r][c]=p;C4.hist.push({r,c,p});
  const line=c4Win(r,c,p);if(line){C4.win=p;C4.line=line;C4.score[p-1]++;LS.set('mt_c4score_'+CLS,C4.score);confetti(160);gT(()=>speak("You win!"),900)}
  else if(C4.grid[0].every(Boolean))C4.win='draw';else C4.turn=p===1?2:1;
  c4Draw();const col=$$('.c4col')[c];if(col)col.querySelectorAll('.c4cell')[r].classList.add('drop')}
function c4Win(r,c,p){for(const [dy,dx] of [[0,1],[1,0],[1,1],[1,-1]]){const L=[[r,c]];for(const s of [1,-1]){let y=r+dy*s,x=c+dx*s;while(y>=0&&y<C4R&&x>=0&&x<C4C&&C4.grid[y][x]===p){L.push([y,x]);y+=dy*s;x+=dx*s}}if(L.length>=4)return L}return null}

const HS_PARTS=k=>[1,2,3,4,5].map(p=>({p,en:enOf(k,p)}));
function hsMatch(f,clues){return clues.every(c=>{const p=HS_PARTS(f.k).find(x=>x.en===c.en);return p&&f.cs[p.p]===c.color})}
function hsCrowd(n){const out=[];for(let i=0;i<n;i++){const k=pick(['a','b','c','d']);const cs={};const pal=shuffle(W9);for(let p=1;p<=5;p++)cs[p]=pal[p-1];out.push({k,cs})}return out}
function hsLayout(n){const W=1000,H=560;const cols=Math.ceil(Math.sqrt(n*W/H*0.42));const rows=Math.ceil(n/cols);const cw=W/cols,ch=H/rows;
  const slots=shuffle(Array.from({length:cols*rows},(_,i)=>i)).slice(0,n);
  return slots.map(s=>{const c=s%cols,r=Math.floor(s/cols);const sc=.9+Math.random()*.2;const hh=ch*1.18*sc;const y=Math.max(hh/2+6,Math.min(H-hh/2-6,(r+.5)*ch+(Math.random()-.5)*ch*.25));return {x:(c+.5)*cw+(Math.random()-.5)*cw*.35,y,h:hh,flip:Math.random()<.5}})}

function hsBoard(crowd,lay){return `<div class="hsfield" id="hsF">${crowd.map((f,i)=>{const L=lay[i];return `<button class="hsp" data-i="${i}" style="left:${L.x/10}%;top:${L.y/5.6}%;height:${L.h/5.6}%;${L.flip?'--fx:-1':''}"><img src="${susImg(f.k,f.cs,.32,true)}" alt="" draggable="false"></button>`}).join('')}</div>`}

function hsFind(){gStop();
  const st={found:0,t0:0,pen:0,started:false,ended:false,timed:HS.mode==='time'};
  const round=()=>{const crowd=hsCrowd(HS.n);const ti=Math.floor(Math.random()*HS.n);const T=crowd[ti];

      `<div class="hsclues"><span class="stamp" style="font-size:22px">WANTED</span>${clueHTML(clues)}</div>${hsBoard(crowd,lay)}<p class="soft" id="hsMsg" style="text-align:center;font-size:19px;margin:6px 0 0">단서를 읽고 범인을 터치해요!</p>`);
    gBind();$('#hsSay').onclick=()=>clueSay(clues);
    $$('.hsp').forEach(b=>b.onclick=()=>{if(st.ended)return;const i=+b.dataset.i;
      if(i===ti){b.classList.add('got');ding(true);st.found++;const hc=$('#hsCnt');if(hc)hc.textContent=st.timed?`잡은 범인 ${st.found}명`:`${st.found} / ${HS.rounds}`;hush();speak("That's right!");gT(()=>{if(!st.timed&&st.found>=HS.rounds)return end();round()},700)}
      else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','no');ding(false);if(!st.timed){st.pen+=2;$('#hsMsg').textContent='앗! 단서를 다시 읽어 봐요 (+2초)'}else $('#hsMsg').textContent='앗! 단서를 다시 읽어 봐요'}});

/* 모드 3: 몇 명 있을까? */
function hsCount(){gStop();let lv=1,score=0,q=0;
  const round=()=>{q++;const crowd=hsCrowd(HS.n);
    const nc=lv>=3?2:1;let clues,cnt;let g=0;
    do{const f=pick(crowd);const parts=shuffle(HS_PARTS(f.k)).slice(0,nc);clues=parts.map(x=>({en:x.en,color:f.cs[x.p]}));
      const want=2+Math.floor(Math.random()*(HS.n>=36?5:4));
      crowd.forEach(o=>{if(!hsMatch(o,clues)&&Math.random()<(want/HS.n)*1.4){clues.forEach(c=>{const p=HS_PARTS(o.k).find(x=>x.en===c.en);if(p)o.cs[p.p]=c.color})}});
      cnt=crowd.filter(o=>hsMatch(o,clues)).length}while((cnt<2||cnt>9)&&g++<40);
    const lay=hsLayout(HS.n);let answered=false;
    app.innerHTML=shell(gHead('🔢 몇 명 있을까?',`<span class="pill" style="font-size:22px">${q}번째 문제</span><span class="pill" style="font-size:22px">맞힌 문제 ${score}</span><button class="btn yel" id="hsSay">🔊 단서 듣기</button>`)+
      `<div class="hsclues"><span style="font-family:var(--f-d);font-size:24px">이런 사람은 모두 몇 명일까요?</span>${clueHTML(clues)}</div>${hsBoard(crowd,lay)}
       <div class="hsnums">${Array.from({length:10},(_,i)=>`<button class="btn" data-n="${i}">${i}</button>`).join('')}<button class="btn sm" id="hsShow">정답 보기</button></div>`);
    gBind();$('#hsSay').onclick=()=>clueSay(clues);clueSay(clues);
    const reveal=(pickN)=>{if(answered)return;answered=true;const ok=pickN===cnt;$$('.hsp').forEach(b=>{const m=hsMatch(crowd[+b.dataset.i],clues);b.classList.add(m?'got':'dim')});
      if(pickN!=null){if(ok){score++;lv++;confetti(120);ding(true);hush();speak(`That's right! ${cnt}!`)}else{ding(false)}}
      $('.hsnums').innerHTML=`<span style="font-family:var(--f-d);font-size:32px">${pickN==null?'':ok?'🎉 정답! ':`🙈 ${pickN}명이 아니에요. `}정답은 <b>${cnt}명</b>이에요</span><button class="btn go big" id="hsNext">다음 문제 ▶</button><button class="btn sm" id="hsSet">설정</button>`;
      $('#hsNext').onclick=round;$('#hsSet').onclick=hsSetup};
    $$('[data-n]').forEach(b=>b.onclick=()=>reveal(+b.dataset.n));$('#hsShow').onclick=()=>reveal(null)};
  round();
}

 [/^🔐 (\S+)반 (\d+)번 수사관$/,m=>`Detective · Class ${m[1]} · No. ${m[2]}`],

 [/^🏆 (\d+)반 (첫 기록이에요!|신기록! \(전: ([\d.]+)초\))$/,m=>m[3]?`New class record! (was ${m[3]} sec)`:'First class record!'],

let BI=LS.get('mt_bi',true);
const HANGUL=/[가-힣]/;
const INLINE=new Set(['B','SPAN','SMALL','I','U','BR','STRONG','EM','SUP','SUB']);
const normT=s=>s.replace(/\s+/g,' ').trim();
function trLookup(t){
  if(EN_DICT[t]!=null)return EN_DICT[t];
  const nums=[];const k=t.replace(/\d+(\.\d+)?/g,m=>{nums.push(m);return '#'});
  if(nums.length&&EN_DICT[k]!=null){let i=0;return EN_DICT[k].replace(/#(\d)?/g,(m,d)=>d?nums[+d-1]:nums[i++])}
  for(const [re,f] of EN_RULES){const m=t.match(re);if(m)return f(m)}
  if(/[A-Za-z]{3}/.test(t)&&!HANGUL.test(t.replace(PARTKO,'')))return '';
  return null}
function isBlock(el){const d=getComputedStyle(el).display;if(d.includes('flex')||d.includes('grid'))return false;
  for(const c of el.childNodes){if(c.nodeType!==1)continue;if(!INLINE.has(c.tagName)||c.classList.contains('tr'))return false;const cd=getComputedStyle(c).display;if(cd!=='inline'&&cd!=='none')return false}return true}
const PARTKO=/(서류 가방|머리카락|티셔츠|원피스|목도리|넥타이|스웨터|모자|가방|우산|코트|치마|풍선|공)/g;
const SKIP='script,style,svg,canvas,input,select,textarea,.tr,.en,#printArea,.wsa4,.c4pop';
function translateTree(root){
  if(!root||root.nodeType!==1)return;
  const walk=el=>{
    if(el.matches(SKIP))return;
    if(el.dataset.trd)return;
    const t=normT(el.textContent||'');
    if(!t||!HANGUL.test(t))return;
    if(isBlock(el)){const en=trLookup(t);if(en===''){el.dataset.trd='1'}else if(en){el.dataset.trd='1';const s=document.createElement('span');s.className='tr';s.textContent=en;el.appendChild(s)}else if(window.__trMiss)window.__trMiss.add(t);return}
    for(const c of [...el.children])walk(c);
    // loose text nodes mixed with block children
    for(const n of [...el.childNodes]){if(n.nodeType===3){const tt=normT(n.textContent);if(tt&&HANGUL.test(tt)){const en=trLookup(tt);if(en===''){}else if(en&&!(n.nextSibling&&n.nextSibling.classList&&n.nextSibling.classList.contains('tr'))){const s=document.createElement('span');s.className='tr';s.textContent=en;n.after(s)}else if(!en&&window.__trMiss)window.__trMiss.add(tt)}}}
  };
  walk(root)}
function applyBI(){document.documentElement.classList.toggle('bi',BI);const b=$('#biBtn');if(b)b.textContent=BI?'🌐 한/EN':'🌐 한국어'}
const trObs=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1&&!n.classList.contains('tr'))translateTree(n)}});
trObs.observe(document.body,{childList:true,subtree:true});
document.addEventListener('click',e=>{if(e.target.closest('#biBtn')){BI=!BI;LS.set('mt_bi',BI);applyBI()}});

applyBI();
render();
if(!STUDENT&&!PIN)checkLock(true);
</script></body></html>
